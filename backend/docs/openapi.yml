      responses:
        "200":
          description: Campus Admin found
    put:
      summary: Update Campus Admin
      operationId: updateCampusAdmin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                instituteId:
                  type: string
                status:
                  type: string
                  enum: [active, suspended]
                password:
                  type: string
      responses:
        "200":
          description: Campus Admin updated
    delete:
      summary: Delete Campus Admin
      operationId: deleteCampusAdmin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Campus Admin deleted

