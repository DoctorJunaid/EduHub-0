components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    InquiryInput:
      type: object
      required:
        - fullName
        - instituteName
        - instituteType
        - email
        - phone
      properties:
        fullName:
          type: string
          example: Habil Aris
        instituteName:
          type: string
          example: SMIT Campus
        instituteType:
          type: string
          enum: [School, College, University, Academy, Other]
          example: Academy
        email:
          type: string
          format: email
          example: habil@example.com
        phone:
          type: string
          example: "+923001234567"
        message:
          type: string
          example: Looking for LMS setup details.

    Inquiry:
      allOf:
        - $ref: "#/components/schemas/InquiryInput"
        - type: object
          properties:
            _id:
              type: string
              example: 64f8c12a8a7c2b0012a45678
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    InstituteInput:
      type: object
      required:
        - name
        - type
        - email
        - phone
      properties:
        name:
          type: string
          example: City Grammar School
        type:
          type: string
          enum: [School, College, University, Coaching / Academy, Other]
          example: School
        email:
          type: string
          example: admin@citygrammar.edu
        phone:
          type: string
          example: "+923009876543"
        address:
          type: string
          example: Main Campus, Block B

    Institute:
      allOf:
        - $ref: "#/components/schemas/InstituteInput"
        - type: object
          properties:
            _id:
              type: string
            status:
              type: string
              enum: [active, inactive]
            createdAt:
              type: string
            updatedAt:
              type: string

    CampusAdminInput:
      type: object
      required:
        - fullName
        - email
        - password
        - instituteId
      properties:
        fullName:
          type: string
          example: Idrees Khan
        email:
          type: string
          example: idrees@citygrammar.edu
        password:
          type: string
          format: password
          example: SecretPass123!
        instituteId:
          type: string
          description: MongoDB ObjectId of the associated Institute
          example: 64f8c12a8a7c2b0012a45678

    TeacherProfileInput:
      type: object
      required:
        - user
        - employeeId
        - department
        - qualification
      properties:
        user:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        employeeId:
          type: string
          example: T-101
        department:
          type: string
          example: Mathematics
        subjectsTaught:
          type: array
          items:
            type: string
          example: ["Algebra", "Calculus"]
        qualification:
          type: string
          example: M.Sc Mathematics
        designation:
          type: string
          example: Senior Teacher
        hireDate:
          type: string
          format: date-time
        isActive:
          type: boolean
          example: true

    StudentProfileInput:
      type: object
      required:
        - user
        - studentId
        - gradeOrClass
        - section
        - rollNumber
        - guardianDetails
      properties:
        user:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        studentId:
          type: string
          example: S-2024-015
        gradeOrClass:
          type: string
          example: Grade 10
        section:
          type: string
          example: A
        rollNumber:
          type: string
          example: "15"
        guardianDetails:
          type: object
          required: [name, phone, relation]
          properties:
            name:
              type: string
              example: Ahmed Khan
            phone:
              type: string
              example: "+923001234567"
            relation:
              type: string
              example: Father
        enrollmentDate:
          type: string
          format: date-time
        isActive:
          type: boolean
          example: true

    ClassScheduleInput:
      type: object
      required:
        - title
        - subject
        - className
        - section
        - dayOfWeek
        - startTime
        - endTime
        - teacherId
      properties:
        title:
          type: string
          example: Mathematics Period 1
        subject:
          type: string
          example: Mathematics
        className:
          type: string
          example: Grade 10
        section:
          type: string
          example: A
        dayOfWeek:
          type: string
          enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "10:00"
        roomNumber:
          type: string
          example: Room 12
        teacherId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        instituteId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        campusId:
          type: string
          example: 64f8c12a8a7c2b0012a45678

    ExamScheduleInput:
      type: object
      required:
        - examName
        - examType
        - className
        - section
        - subject
        - examDate
        - startTime
        - endTime
      properties:
        examName:
          type: string
          example: Midterm Exam
        examType:
          type: string
          enum: [Midterm, Final, Quiz, Assignment, Practical]
        className:
          type: string
          example: Grade 10
        section:
          type: string
          example: A
        subject:
          type: string
          example: Biology
        examDate:
          type: string
          format: date-time
        startTime:
          type: string
          example: "10:00"
        endTime:
          type: string
          example: "11:30"
        roomNumber:
          type: string
          example: Lab 2
        teacherId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        instituteId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        campusId:
          type: string
          example: 64f8c12a8a7c2b0012a45678

    TeacherAttendanceInput:
      type: object
      required:
        - teacherId
        - date
        - status
      properties:
        teacherId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [present, absent, late, on leave]
        remarks:
          type: string
          example: Medical leave approved
        instituteId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        campusId:
          type: string
          example: 64f8c12a8a7c2b0012a45678

    StudentAttendanceInput:
      type: object
      required:
        - studentId
        - date
        - status
      properties:
        studentId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [present, absent, late, excused]
        remarks:
          type: string
          example: Permission granted
        instituteId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        campusId:
          type: string
          example: 64f8c12a8a7c2b0012a45678

    FeeRecordInput:
      type: object
      required:
        - studentId
        - feeType
        - amount
        - dueDate
      properties:
        studentId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        feeType:
          type: string
          enum: [tuition, library, transport, exam, miscellaneous]
        amount:
          type: number
          example: 25000
        paidAmount:
          type: number
          example: 10000
        dueDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, partial, paid, overdue]
        notes:
          type: string
          example: First installment paid
        instituteId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        campusId:
          type: string
          example: 64f8c12a8a7c2b0012a45678

    PerformanceInput:
      type: object
      required:
        - studentId
        - examName
        - subject
        - term
        - marksObtained
        - totalMarks
      properties:
        studentId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        examName:
          type: string
          example: Monthly Test
        subject:
          type: string
          example: Physics
        term:
          type: string
          example: Term 1
        marksObtained:
          type: number
          example: 82
        totalMarks:
          type: number
          example: 100
        grade:
          type: string
          example: A
        remarks:
          type: string
          example: Good performance
        instituteId:
          type: string
          example: 64f8c12a8a7c2b0012a45678
        campusId:
          type: string
          example: 64f8c12a8a7c2b0012a45678

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation Error
        errors:
          type: array
          items:
            type: string
